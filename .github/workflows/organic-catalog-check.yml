name: organic-catalog-check

on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Independent OccupancyNPV catalog check
        run: node scripts/occupancynpv-independent-catalog-check.mjs
